plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.group
base { archivesName = project.archives_base_name }

loom {
	accessWidenerPath = file("src/main/resources/autoanvil.accesswidener")

	runs {
		client {
			// Developer end-to-end test: ./gradlew runClient -Pselftest
			if (project.hasProperty("selftest")) {
				def mode = project.property("selftest")
				vmArg "-Dautoanvil.selftest=${mode ? mode : 'true'}"
			}
		}
	}

	mods {
		"autoanvil" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

test {
	useJUnitPlatform()
	testLogging { events "passed", "failed"; showStandardStreams = true }
}

processResources {
	def props = [
		version             : project.version,
		minecraft_dependency: "~${project.minecraft_version}",
		java_version        : project.java_version,
		loader_version      : project.loader_version,
	]
	inputs.properties(props)
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.toVersion(project.java_version)
	targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
	from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } }
}
